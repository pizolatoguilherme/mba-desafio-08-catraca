# Produto Catraca: app (Fastify) + db (Postgres 16, não exposto no host).
# COMPOSE_PROJECT_NAME sobrescreve "name" (containers, rede, volume e imagem por projeto);
# CATRACA_PORT muda a porta publicada. Nenhuma variável é obrigatória.
name: catraca

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CATRACA_PORT:-3000}:3000"
    environment:
      TZ: America/Sao_Paulo
      PORT: "3000"
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca
      GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
      GATEWAY_POLL_MS: ${GATEWAY_POLL_MS:-250}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-parceiro-2026}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 60s

volumes:
  db-data:
